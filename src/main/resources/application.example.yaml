spring:
  application:
    name: FuluoGame
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  logging:
    level:
      com.shuimumu:debug
  rabbitmq:
    host:
    port:
    username: guest
    password: guest
    virtual-host: /
    # 发布端可靠性：correlated 确认 + mandatory 退回
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 5
        # 重试耗尽的毒消息交给 DLX 死信，避免无限重投
        default-requeue-rejected: false
    connection-timeout: 1000
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fuluogame?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username:
    password:
  data:
    redis:
      host:
      port:
elasticsearch:
  host:
  port:
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shuimumu.fuluogame.entity
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shuimumu.fuluogame.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
aliyun:
  oss:
    # 显式开关：true 才创建 OSS Bean
    enabled: false
    bucket-name:
    endpoint:
    access-key-id:
    access-key-secret:
  green:
    # 显式开关：true 才创建内容审核 SDK Bean
    enabled: false
    access-key-id:
    access-key-secret:
fuluo:
  moderation:
    # 内容审核总开关：生产必须 true
    enabled: true
logging:
  level:
    com:
      shuimumu:
        fuluogame:
          mapper: debug
          service: info
          controller: info
